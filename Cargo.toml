[package]
name = "name-sayer"
version = "0.0.13"
description = "authoritative DNS server with blocklist features"
readme = "README.md"
homepage = "https://crates.io/crates/name-sayer"
repository = "https://github.com/gabrielfalcao/name-sayer"
license = "MIT OR Apache-2.0"
edition = "2024"
autoexamples = false
autotest = false
autobenches = false
default-run = "name-sayer"

# categories = [] # https://crates.io/category_slugs


[package.metadata]
targets = [
    # "aarch64-apple-darwin",
    # "x86_64-unknown-linux-gnu",
    # "aarch64-unknown-linux-gnu",
]

[profile.release] # https://github.com/johnthagen/min-sized-rust
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size. https://doc.rust-lang.org/cargo/reference/profiles.html#opt-level
lto = true
panic = "abort"
codegen-units = 1
# https://github.com/johnthagen/min-sized-rust?tab=readme-ov-file#remove-fmtdebug



[lib]
name = "name_sayer"
path = "src/lib.rs"

doctest = false
bench = false
doc = false
test = false


[[bin]]
name = "name-sayer"
path = "src/bin/name-sayer.rs"
doctest = false
bench = false
doc = false
test = false

[[bin]]
name = "dns-client"
path = "src/bin/dns-client.rs"
doctest = false
bench = false
doc = false
test = false
[[bin]]
name = "upstream-servers"
path = "src/bin/upstream-servers.rs"
doctest = false
bench = false
doc = false
test = false

[dependencies]
async-trait = "0.1.92"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["cargo", "derive", "env", "string", "unicode", "wrap_help"] }
color-eyre = { version = "0.6.5", features = ["issue-url", "url"] }
fast-glob = "1.1.2"
fern = { version = "0.7.1", features = ["colored", "date-based", "libc", "meta-logging-in-format", "reopen-03", "reopen-1", "reopen03", "reopen1", "syslog-3", "syslog-4", "syslog-6", "syslog-7", "syslog3", "syslog4", "syslog6", "syslog7"] }
hickory-net = "0.26.3"
hickory-proto = { version = "0.26.3", features = ["access-control", "dnssec-aws-lc-rs", "dnssec-ring", "mdns", "no-std-rand", "serde", "testing", "wasm-bindgen"] }
hickory-resolver = { version = "0.26.3", features = ["dnssec-aws-lc-rs", "dnssec-ring", "h3-aws-lc-rs", "h3-ring", "https-aws-lc-rs", "https-ring", "metrics", "quic-aws-lc-rs", "quic-ring", "recursor", "rustls-platform-verifier", "serde", "tls-aws-lc-rs", "tls-ring", "toml", "webpki-roots"] }
hickory-server = { version = "0.26.3", features = ["blocklist", "dnssec-aws-lc-rs", "dnssec-ring", "h3-aws-lc-rs", "h3-ring", "https-aws-lc-rs", "https-ring", "metrics", "quic-aws-lc-rs", "quic-ring", "recursor", "resolver", "rustls-platform-verifier", "sqlite", "testing", "tls-aws-lc-rs", "tls-ring", "toml", "webpki-roots"] }
iocore = "3.2.0"
lazy_mut = "0.2.1"
log = "0.4.35"
match-domain = "0.1.3"
owo-colors = { version = "4.4.0", features = ["supports-color", "supports-colors"] }
pin-project-lite = "0.2.17"
regex = { version = "1.13.1", features = ["logging", "pattern", "perf-dfa-full", "unstable", "use_std"] }
rune-host-match = "0.1.1"
serde = { version = "1.0.229", features = ["derive", "rc", "serde_derive", "unstable"] }
supports-color = "3.0.2"
tabled = "0.22.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "full", "io-std", "io-uring", "io-util", "libc", "macros", "mio", "net", "parking_lot", "process", "rt", "rt-multi-thread", "schedule-latency", "signal", "signal-hook-registry", "socket2", "sync", "taskdump", "test-util", "time", "tokio-macros", "tracing", "windows-sys"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["expose_internals", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
